<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Propogation</title>
    <style>
        body{font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;}
        div{
            min-height: 100px;
            min-width: 100px;
            padding: 20px;
            border: 1px solid darkmagenta;  
        }
    </style>
</head>
<body>
    <h1>Event Propogation</h1>

    <p>Event Bubbling - false (default)</p>
    <p>Event Capturing - true</p>

    <div id="grandParent">
        <div id="parent">
            <div id="child"></div>
        </div>
    </div>

    <script>
        document.getElementById("grandParent").addEventListener("click", () => {
            console.log("Grand Parents");  
        },false); //bubbling

        document.getElementById("parent").addEventListener("click", (e) => {
            console.log("Parents");  
            e.stopPropagation();
        },false); //bubbling
        
        document.getElementById("child").addEventListener("click", () => {
            console.log("Child");  
        },false);//bubbling
    </script>

</body>
</html>
