<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>body{font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;}</style>
    <script>
      function add(a, b) {
        return a + b;
      }

      console.log(add(2, 3)); // Output: 5
      console.log(add(2, 3)); // Output: 5 (always the same output for the same inputs)

    </script>
  </head>
  <body>
    <h1>Pure Function</h1>
    <p><b>Explanation:</b> <br>
        The add function takes two arguments, a and b, and returns their sum.<br>
        Given the same inputs (e.g., 2 and 3), it always returns the same result (5).<br>
        It does not modify any external state or produce any side effects, making it a pure function.</p>
  </body>
</html>
