<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise</title>
</head>
<body>
    <h1>Promise</h1>

    <script>
        // 1
        // creating promise
        const promiseOne = new Promise(function(resolve,reject){
            // Async task (DB, File handling, Network....)
            setTimeout(function(){
                console.log("Async 1 task completed");
                resolve();
            },1000)
        });
        
        // consuming promise
        promiseOne.then(function(){
            console.log("Promise 1 Consumed");
            
        });
        
        

        // 2
        new Promise(function(resolve,reject){
            // Async task (DB, File handling, Network....)
            setTimeout(function(){
                console.log("Async task 2 completed ");
                resolve();
            },1500)
        }).then(function(){
            console.log("Promise 2 Consumed");  
        });
        

        
        // 3
        const promiseThree = new Promise(function(resolve,reject){
            setTimeout(function(){
                resolve({username: "kushang", email:"kushang81@gmail.com"});
            },2000)
        });

        promiseThree.then(function(user){
            console.log("Promise 3 Consumed",user);
        })



        // 4
        const promiseFour = new Promise((resolve,reject) => {
            setTimeout(() => {
                let error = false;
                if(!error){
                    resolve({username: "virat kohli", age:35});
                }else{
                    reject("something went wrong :(");
                }
            },2500)
        });

        promiseFour
        .then((user) => {
            console.log(user);
            return user.username
        })
        .then((username) => {
            console.log(username);
        })
        .catch(error => console.log(error))
        .finally(() => {
            console.log("FINALLY: Your Promise is ethier resolved or rejected");
        })


        // 5
        const promiseFive = new Promise(function(resolve,reject){
            setTimeout(() => {
                let error = false;
                if(!error){
                    resolve({username: "Javascript", engine: "V8"});
                }else{
                    reject("JS went wrong :(");
                }
            },3000)
        })

        async function consumePromiseFive() {
              try {
                  const response = await promiseFive;
                  console.log(response);
              } catch (error) {
                console.log(error);
                
              }
        }
        consumePromiseFive();

        //       const data = await response.json();
        //       console.log(data);
        // } catch (error) {
        //     console.log("ERROR :: ", error);
        // }
        // }
        // getAllUsers();


        // 7
        fetch("https://jsonplaceholder.typicode.com/users")
        .then(response => {
            return response.json()
        })
        .then(data => console.log(data))
        .catch(error => console.log("ERROR: ",error))

    </script>
</body>
</html>
